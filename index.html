<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24272c">
  <title>黑篙的声库 | Heigao’s Voicebanks</title>
  <meta name="description" content="黑篙的声库目录，收录熵尾音 咬青与开发中的熵尾音 恒星，可查看声库资料、配布素材与更新日志。">
  <link rel="canonical" href="https://kuro-utau.heigao.me/">
  <link rel="icon" href="favicon.ico">
  <script>
    // Bookmarks from before the catalog opened point to sections of Kousei's page.
    const kouseiSection = /^#(?:hero|demo|profile|voicebank|download(?:-github|-bowlroll|-mirrors)?|guidelines|protocol-(?:zh|en|jp)|faq(?:-answer-[1-7])?|contact)$/;
    function openBookmarkedSection() {
      if (kouseiSection.test(location.hash)) {
        location.replace('kousei.html' + location.search + location.hash);
      }
    }
    window.addEventListener('hashchange', openBookmarkedSection);
    openBookmarkedSection();
  </script>
  <link rel="stylesheet" href="assets/catalog.css">
  <script defer src="assets/catalog.js"></script>
</head>
<body>
  <main class="shelf">
    <header class="topline">
      <h1 lang="en">Heigao’s Voicebanks</h1>
      <span data-copy="catalog">黑篙的声库</span>
    </header>
    <div class="catalog-bar">
      <nav class="catalog-sections" aria-label="栏目" hidden>
        <button data-section="shelf" data-copy="shelf" aria-controls="shelf" aria-pressed="true">声库目录</button>
        <button data-section="assets" data-copy="assets" aria-controls="assets" aria-pressed="false">素材下载</button>
        <button data-section="journal" data-copy="journal" aria-controls="journal" aria-pressed="false">声库日志</button>
      </nav>
      <nav class="catalog-languages" aria-label="选择语言" hidden>
        <a href="#zh" lang="zh-CN" hreflang="zh-CN">中文</a>
        <a href="#en" lang="en" hreflang="en">English</a>
        <a href="#ja" lang="ja" hreflang="ja">日本語</a>
      </nav>
    </div>
    <div id="shelf">
      <a data-local-link="page" class="release" href="kousei.html" aria-labelledby="kousei-name kousei-enter">
        <div class="jacket" aria-hidden="true">
          <div class="disc"></div>
          <div class="cover">
            <b lang="en">Kousei</b>
            <span class="cover-name" lang="zh-CN">咬青</span>
            <img src="assets/images/character-640w.webp"
                 srcset="assets/images/character-320w.webp 320w, assets/images/character-640w.webp 640w, assets/images/character.webp 1265w"
                 sizes="(max-width: 532px) min(75vw, 267px), (min-width: 1563px) 28vw, calc(21vw + 104px)" width="640" height="883" alt="">
          </div>
        </div>
        <div class="detail">
          <h2 id="kousei-name" data-copy="name">熵尾音 咬青</h2>
          <p><span data-copy="format">日语 UTAU 声库</span><br><span data-copy="voices">软声、真声、假声</span></p>
          <span class="jump" id="kousei-enter"><span data-copy="enter">进入声库</span> <span aria-hidden="true">↗</span></span>
        </div>
      </a>
      <a class="release" data-local-link="stellar" href="hengxing.html" aria-labelledby="stellar-name stellar-status">
        <div class="jacket" aria-hidden="true">
          <div class="disc"></div>
          <div class="cover stellar-art">
            <b lang="en">Kousei</b>
            <span class="cover-name" lang="zh-CN">恒星</span>
          </div>
        </div>
        <div class="detail">
          <h2 id="stellar-name" data-copy="starName">熵尾音 恒星</h2>
          <p><span data-copy="ai">AI 声库</span><br><span id="stellar-status" data-copy="unreleased">暂未发布</span></p>
          <span class="jump"><span data-copy="enter">进入声库</span> <span aria-hidden="true">↗</span></span>
        </div>
      </a>
    </div>
    <section id="assets" class="catalog-panel" hidden>
      <h2 id="assets-title" data-copy="assets">素材下载</h2>
      <div class="bank-picker" role="group" aria-labelledby="assets-title">
        <button type="button" aria-pressed="true" aria-controls="kousei-assets"><span class="thumb kousei-art" aria-hidden="true"></span><span data-copy="name">熵尾音 咬青</span></button>
        <button type="button" aria-pressed="false" aria-controls="stellar-assets"><span class="thumb stellar-art" aria-hidden="true"></span><span data-copy="starName">熵尾音 恒星</span></button>
      </div>
      <section id="kousei-assets" class="bank-panel">
        <div class="file-row">
          <span data-copy="guide">V1.1 使用指南</span><small>TXT</small>
          <a href="Readme.txt" data-local-link="guideFile" download data-copy="download">下载</a>
        </div>
      </section>
      <section id="stellar-assets" class="bank-panel" hidden>
        <p data-copy="noAssets">暂无公开下载的素材。</p>
      </section>
    </section>
    <section id="journal" class="catalog-panel" hidden>
      <h2 id="journal-title" data-copy="journal">声库日志</h2>
      <div class="bank-picker" role="group" aria-labelledby="journal-title">
        <button type="button" aria-pressed="true" aria-controls="kousei-journal"><span class="thumb kousei-art" aria-hidden="true"></span><span data-copy="name">熵尾音 咬青</span></button>
        <button type="button" aria-pressed="false" aria-controls="stellar-journal"><span class="thumb stellar-art" aria-hidden="true"></span><span data-copy="starName">熵尾音 恒星</span></button>
      </div>
      <section id="kousei-journal" class="bank-panel">
        <time datetime="2026-11">2026.11</time>
        <h3 data-copy="guide">V1.1 使用指南</h3>
        <p data-copy="guideNote">本版指南列出了三种声线的录制音高、角色资料与使用条款。</p>
        <a href="kousei.html#guidelines" data-local-link="guidePage" data-copy="readGuide">阅读指南</a>
      </section>
      <section id="stellar-journal" class="bank-panel" hidden>
        <p data-copy="noEntries">暂无日志。</p>
      </section>
    </section>
    <noscript>
      <p class="shortcuts"><a href="kousei.html#demo">试听</a> · <a href="kousei.html#download">下载</a> · <a href="kousei.html#guidelines">使用协议</a></p>
      <p class="shortcuts"><a href="index-en.html" lang="en">Voicebank details in English</a> · <a href="index-jp.html" lang="ja">日本語の音源ページ</a></p>
    </noscript>
  </main>
</body>
</html>
